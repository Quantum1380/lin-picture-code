server:
  port: 8080
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
spring:
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
  application:
    name: lin-picture-backend
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lin-picture
    username:
    password:
  # Redis 配置
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    timeout: 5000
# mybatis-plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
# 阿里云 AI 配置
#aliYunAi:
  apiKey:
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: V1.0
    group:
      default:
        group-name: LinYu
        api-rule: package
        api-rule-resources:
          - com.linyu.linpicturebackend.controller
# 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host:
    secretId:
    secretKey:
    region:
    bucket: